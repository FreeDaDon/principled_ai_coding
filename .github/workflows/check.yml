# The same deterministic gate as a local commit: ruff, mypy, pytest. Fully offline (the tests force
# PAC_RUNNER=mock), so it needs no secrets and costs nothing but runner minutes.
name: check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: scripts/check.sh
