# Real Claude calls, so manual only: run it after a change to prompts, the Director or the evaluator, and compare
# evals/results.jsonl against the last run. Needs the ANTHROPIC_API_KEY repository secret. Cost is capped per
# example by budget_usd (4 examples).
name: live-eval

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Cap per example, USD"
        default: "2"
      coder_model:
        description: "Coder model (blank = each example's config)"
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm install -g @anthropic-ai/claude-code
      - run: uv sync --locked
      - name: Director over every example (live)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_USD: ${{ inputs.budget_usd }}
          CODER_MODEL: ${{ inputs.coder_model }}
        run: |
          uv run adws/adw_eval.py --budget-usd "$BUDGET_USD" --sandbox bwrap ${CODER_MODEL:+--coder-model "$CODER_MODEL"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results.jsonl
            .pac/runs/
